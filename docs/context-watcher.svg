.walk{animation:walk 9s linear infinite}@keyframes walk{0%{transform:translateX(-60px)}100%{transform:translateX(940px)}}
.eye{animation:look 4s steps(1) infinite}@keyframes look{0%,40%{transform:translateX(0)}50%,90%{transform:translateX(1px)}}
.grow{animation:grow 6s ease-in-out infinite}@keyframes grow{0%{width:40px}45%{width:420px}55%{width:420px}70%{width:120px}100%{width:40px}}
.sh{animation:sh 2.4s linear infinite}@keyframes sh{0%{transform:translateX(-80px)}100%{transform:translateX(520px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
