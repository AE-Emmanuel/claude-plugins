<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" height="180"><style>
.run .la{animation:st .5s steps(1) infinite}.run .lb{animation:st .5s steps(1) infinite -.25s}
.run .bd{animation:bob .5s steps(1) infinite -.125s}.run g{transform-box:fill-box}
@keyframes st{50%{transform:translateY(-1px)}}@keyframes bob{50%{transform:translateY(1px)}}
.t0{animation:tw 3.6s ease-in-out infinite}.t1{animation:tw 4.2s ease-in-out infinite -1s}
.t2{animation:tw 4.7s ease-in-out infinite -2s}.t3{animation:tw 5.2s ease-in-out infinite -3s}
@keyframes tw{0%,100%{opacity:.45}50%{opacity:1}}
.walk{animation:walk 9s linear infinite}@keyframes walk{0%{transform:translateX(-60px)}100%{transform:translateX(940px)}}
.eye{animation:look 4s steps(1) infinite}@keyframes look{0%,40%{transform:translateX(0)}50%,90%{transform:translateX(1px)}}
.grow{animation:grow 6s ease-in-out infinite}@keyframes grow{0%{width:40px}45%{width:420px}55%{width:420px}70%{width:120px}100%{width:40px}}
.sh{animation:sh 2.4s linear infinite}@keyframes sh{0%{transform:translateX(-80px)}100%{transform:translateX(520px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
